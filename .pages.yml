# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Each section of the site is a JSON file in /data that admins edit with simple forms.
media:
  input: img/uploads
  output: /img/uploads
  categories: [image]

content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" } }
      - { name: image, label: Photo, type: image }
      - { name: body, label: Story, type: rich-text }

  - name: gigs
    label: Gigs
    type: file
    path: data/gigs.json
    format: json
    list: true
    fields:
      - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" }, description: "Shows before today move to Past Shows automatically (newest first). For a TBA month, pick the 1st." }
      - { name: display, label: "Date text (optional)", type: string, description: "e.g. March 2027 (TBA). Leave blank to show the date." }
      - { name: venue, label: Venue, type: string, description: "Leave blank if unknown; the city shows instead." }
      - { name: city, label: "City / address", type: string }
      - { name: with, label: "With (other bands)", type: string }
      - { name: tba, label: "Date not confirmed (TBA)", type: boolean }
      - { name: note, label: Note, type: string, description: "Shown on the site, e.g. Album release show. Never put cover prices, pay or door splits here." }
      - { name: video, label: "Video link (YouTube; shows a Watch button on past shows)", type: string }
      - { name: source, label: "Source link (not shown on the site)", type: string, description: "Where this show was verified, for the band's records only." }

  - name: gallery
    label: Photo Gallery
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - { name: image, label: Photo, type: image, required: true }
      - { name: caption, label: Caption, type: string }
      - { name: alt, label: "Describe the photo (for screen readers)", type: string }
      - { name: width, label: "Photo width in pixels (optional, helps the page load smoothly)", type: number }
      - { name: height, label: "Photo height in pixels (optional)", type: number }

  - name: members
    label: Band Members
    type: file
    path: data/members.json
    format: json
    list: true
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role, type: string }
      - { name: photo, label: Headshot (square), type: image }
      - { name: bio, label: Bio, type: text }

  - name: releases
    label: Releases
    type: file
    path: data/releases.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: year, label: Year, type: number, required: true }
      - name: type
        label: Type
        type: select
        options: { values: [album, ep] }
      - { name: cover, label: Cover art, type: image }
      - { name: note, label: "Note (e.g. 10 songs · NEW)", type: string }
      - { name: link, label: Listen link, type: string }
      - name: logo_position
        label: "EP logo tile (only for the 4 logo EPs)"
        type: select
        options: { values: [none, top-left, top-right, bottom-left, bottom-right] }

  - name: press
    label: Press & Radio
    type: file
    path: data/press.json
    format: json
    list: true
    fields:
      - { name: type, label: Type, type: select, options: { values: [review, chart, radio, feature, interview, release] } }
      - { name: featured, label: "Spotlight (off = goes in the 'More press' list)", type: boolean }
      - { name: outlet, label: "Outlet / station", type: string, required: true }
      - { name: writer, label: "Writer (if named)", type: string }
      - { name: date, label: Date, type: date, options: { format: "yyyy-MM-dd" } }
      - { name: headline, label: Headline, type: string, required: true }
      - { name: release, label: "Release reviewed", type: string }
      - { name: score, label: "Score (exactly as given, e.g. 7.5/10)", type: string }
      - { name: detail, label: Detail, type: string }
      - { name: quote, label: "Quote (exact words only)", type: text }
      - { name: url, label: "Source link", type: string }
      - name: stats
        label: "Chart stats (chart highlight only)"
        type: object
        list: true
        fields:
          - { name: value, label: "Number (e.g. 22+)", type: string }
          - { name: label, label: Label, type: string }
